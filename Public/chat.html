<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat — ChatApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      height: 100vh; display: flex; flex-direction: column;
      background: #0f0f1a; color: #fff; overflow: hidden;
    }

    /* HEADER */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #6c63ff, #ff6584);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .header-sub { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 1px; display: flex; align-items: center; }
    .online-dot {
      width: 8px; height: 8px;
      background: #43e7ad;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .username-badge {
      background: rgba(108,99,255,0.2);
      border: 1px solid rgba(108,99,255,0.3);
      color: #a89dff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }
    .logout-btn {
      background: rgba(255,100,100,0.1);
      border: 1px solid rgba(255,100,100,0.2);
      color: #ff8080;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .logout-btn:hover { background: rgba(255,100,100,0.2); }

    /* MESSAGES */
    .messages-container {
      flex: 1; overflow-y: auto;
      padding: 24px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
    }
    .messages-container::-webkit-scrollbar { width: 4px; }
    .messages-container::-webkit-scrollbar-track { background: transparent; }
    .messages-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .message {
      display: flex; flex-direction: column;
      max-width: 65%;
      animation: msgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.own { align-self: flex-end; align-items: flex-end; }
    .message.other { align-self: flex-start; align-items: flex-start; }

    .msg-sender {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      margin-bottom: 4px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .message.own .msg-bubble {
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      border-bottom-right-radius: 4px;
      color: #fff;
    }
    .message.other .msg-bubble {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-left-radius: 4px;
      color: rgba(255,255,255,0.9);
    }
    .msg-time {
      font-size: 10px;
      color: rgba(255,255,255,0.25);
      margin-top: 4px;
      padding: 0 4px;
    }

    .empty-state {
      flex: 1; display: flex;
      flex-direction: column;
      align-items: center; justify-content: center;
      color: rgba(255,255,255,0.2);
      gap: 12px;
    }
    .empty-state .icon { font-size: 48px; }
    .empty-state p { font-size: 15px; }

    /* INPUT */
    .input-area {
      padding: 16px 24px;
      background: rgba(255,255,255,0.04);
      border-top: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .input-row {
      display: flex; gap: 12px; align-items: center;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 8px 8px 8px 20px;
      transition: all 0.3s;
    }
    .input-row:focus-within {
      border-color: #6c63ff;
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }
    #messageInput {
      flex: 1; background: none; border: none;
      outline: none; color: #fff;
      font-size: 14px; font-family: 'Inter', sans-serif;
      padding: 6px 0;
    }
    #messageInput::placeholder { color: rgba(255,255,255,0.25); }
    .send-btn {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      border: none; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(108,99,255,0.4); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn svg { width: 18px; height: 18px; fill: white; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="logo-icon">💬</div>
      <div>
        <div class="header-title">Global Chat</div>
        <!-- CHANGED HERE: added id="onlineStatus" -->
        <div class="header-sub" id="onlineStatus"><span class="online-dot"></span>1 Online</div>
      </div>
    </div>
    <div class="header-right">
      <span class="username-badge" id="usernameDisplay">...</span>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="messages-container" id="messagesContainer">
    <div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <p>No messages yet. Say hello!</p>
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-row">
      <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" />
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const BACKEND_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:5000'
      : window.location.origin;

    // Check auth
    const token = localStorage.getItem('token');
    const username = localStorage.getItem('username');
    const userId = localStorage.getItem('userId');

    if (!token) window.location.href = 'login.html';

    document.getElementById('usernameDisplay').textContent = username || 'User';

    // Connect to socket
    const socket = io(BACKEND_URL);

    // CHANGED HERE: Listen for live online user updates from server
    socket.on('updateUserCount', (count) => {
      const onlineStatus = document.getElementById('onlineStatus');
      if (onlineStatus) {
        onlineStatus.innerHTML = `<span class="online-dot"></span>${count} Online`;
      }
    });

    const messagesContainer = document.getElementById('messagesContainer');
    const emptyState = document.getElementById('emptyState');
    let messageCount = 0;

    function formatTime(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(msg, isOwn) {
      if (emptyState) emptyState.style.display = 'none';
      messageCount++;

      const senderName = msg.sender?.username || msg.sender || 'Unknown';
      const div = document.createElement('div');
      div.className = `message ${isOwn ? 'own' : 'other'}`;
      div.innerHTML = `
        ${!isOwn ? `<div class="msg-sender">${senderName}</div>` : ''}
        <div class="msg-bubble">${msg.text}</div>
        <div class="msg-time">${formatTime(msg.createdAt || new Date())}</div>
      `;
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Load previous messages
    socket.on('previousMessages', (messages) => {
      messages.forEach(msg => {
        const isOwn = msg.sender?.username === username;
        addMessage(msg, isOwn);
      });
    });

    // Receive new message
    socket.on('newMessage', (msg) => {
      const isOwn = msg.sender?.username === username;
      addMessage(msg, isOwn);
    });

    // Send message
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      // Decode userId from token
      const payload = JSON.parse(atob(token.split('.')[1]));
      socket.emit('sendMessage', { userId: payload.userId, text });
      input.value = '';
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);

    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
