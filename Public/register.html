<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — ChatApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0f0f1a; overflow: hidden;
    }
    .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.35;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width: 400px; height: 400px; background: #43e7ad; top: -100px; right: -100px; animation-delay: 0s; }
    .orb-2 { width: 300px; height: 300px; background: #6c63ff; bottom: -80px; left: -80px; animation-delay: 3s; }
    .orb-3 { width: 200px; height: 200px; background: #ff6584; top: 40%; right: 30%; animation-delay: 1.5s; }
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }
    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px; padding: 48px 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #43e7ad, #6c63ff);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .logo-text { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    h1 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 8px; letter-spacing: -0.5px; }
    .subtitle { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
    input {
      width: 100%; padding: 14px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; color: #fff;
      font-size: 15px; font-family: 'Inter', sans-serif;
      outline: none; transition: all 0.3s ease;
    }
    input::placeholder { color: rgba(255,255,255,0.25); }
    input:focus {
      border-color: #43e7ad;
      background: rgba(67,231,173,0.08);
      box-shadow: 0 0 0 3px rgba(67,231,173,0.15);
    }
    .btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #43e7ad, #6c63ff);
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif;
      cursor: pointer; transition: all 0.3s ease; margin-top: 8px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(67,231,173,0.3); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .footer-text { text-align: center; margin-top: 24px; font-size: 14px; color: rgba(255,255,255,0.4); }
    .footer-text a { color: #43e7ad; text-decoration: none; font-weight: 500; }
    .footer-text a:hover { color: #6c63ff; }
    .error-msg {
      background: rgba(255,100,100,0.15);
      border: 1px solid rgba(255,100,100,0.3);
      color: #ff8080; padding: 12px 16px;
      border-radius: 10px; font-size: 13px;
      margin-bottom: 20px; display: none;
    }
    .success-msg {
      background: rgba(67,231,173,0.15);
      border: 1px solid rgba(67,231,173,0.3);
      color: #43e7ad; padding: 12px 16px;
      border-radius: 10px; font-size: 13px;
      margin-bottom: 20px; display: none;
    }
    .error-msg.show, .success-msg.show { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">💬</div>
      <span class="logo-text">ChatApp</span>
    </div>
    <h1>Create account</h1>
    <p class="subtitle">Join and start chatting instantly</p>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <form id="registerForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username" required />
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required />
      </div>
      <button type="submit" class="btn" id="registerBtn">Create Account</button>
    </form>
    <p class="footer-text">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>

  <script>
    const BACKEND_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:5000'
      : window.location.origin;

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('registerBtn');
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      btn.textContent = 'Creating account...';
      btn.disabled = true;
      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');

      try {
        const res = await fetch(`${BACKEND_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errorMsg.textContent = data.message || 'Registration failed';
          errorMsg.classList.add('show');
          btn.textContent = 'Create Account';
          btn.disabled = false;
          return;
        }
        successMsg.textContent = 'Account created! Redirecting to login...';
        successMsg.classList.add('show');
        setTimeout(() => window.location.href = 'login.html', 1500);
      } catch (err) {
        errorMsg.textContent = 'Cannot connect to server. Try again.';
        errorMsg.classList.add('show');
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
