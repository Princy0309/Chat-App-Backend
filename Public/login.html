<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — ChatApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      overflow: hidden;
    }
    .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width: 400px; height: 400px; background: #6c63ff; top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 300px; height: 300px; background: #ff6584; bottom: -80px; right: -80px; animation-delay: 3s; }
    .orb-3 { width: 200px; height: 200px; background: #43e7ad; top: 50%; left: 50%; animation-delay: 1.5s; }
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }
    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #6c63ff, #ff6584);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .logo-text { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    h1 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 8px; letter-spacing: -0.5px; }
    .subtitle { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
    input {
      width: 100%; padding: 14px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; color: #fff;
      font-size: 15px; font-family: 'Inter', sans-serif;
      outline: none; transition: all 0.3s ease;
    }
    input::placeholder { color: rgba(255,255,255,0.25); }
    input:focus {
      border-color: #6c63ff;
      background: rgba(108,99,255,0.1);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }
    .btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif;
      cursor: pointer; transition: all 0.3s ease;
      margin-top: 8px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(108,99,255,0.4); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .footer-text { text-align: center; margin-top: 24px; font-size: 14px; color: rgba(255,255,255,0.4); }
    .footer-text a { color: #6c63ff; text-decoration: none; font-weight: 500; }
    .footer-text a:hover { color: #8b5cf6; }
    .error-msg {
      background: rgba(255,100,100,0.15);
      border: 1px solid rgba(255,100,100,0.3);
      color: #ff8080; padding: 12px 16px;
      border-radius: 10px; font-size: 13px;
      margin-bottom: 20px; display: none;
    }
    .error-msg.show { display: block; animation: shake 0.4s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">💬</div>
      <span class="logo-text">ChatApp</span>
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue chatting</p>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>
    <p class="footer-text">
      Don't have an account? <a href="register.html">Create one</a>
    </p>
  </div>

  <script>
    const BACKEND_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:5000'
      : window.location.origin;

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');

      btn.textContent = 'Signing in...';
      btn.disabled = true;
      errorMsg.classList.remove('show');

      try {
        const res = await fetch(`${BACKEND_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errorMsg.textContent = data.message || 'Login failed';
          errorMsg.classList.add('show');
          btn.textContent = 'Sign In';
          btn.disabled = false;
          return;
        }
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        window.location.href = 'chat.html';
      } catch (err) {
        errorMsg.textContent = 'Cannot connect to server. Try again.';
        errorMsg.classList.add('show');
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
